name: travel-destination-planner

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelDestinationPlanner
      POSTGRES_USER: travelDestinationPlanner
      POSTGRES_PASSWORD: travelDestinationPlanner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service -d service"]
      interval: 5s
      timeout: 3s
      retries: 20


  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'

volumes:
  postgres_data:
