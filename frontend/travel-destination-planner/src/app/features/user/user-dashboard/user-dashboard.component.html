<div class="fawry-page-bg page">
  <header class="hero">
    <h1>Welcome</h1>
    <p>Explore destinations and keep your travel wishlist in one place.</p>
  </header>

  <div class="cards">
    <mat-card class="fawry-card-accent dash-card" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="avatar teal">
          <mat-icon>public</mat-icon>
        </div>
        <mat-card-title>Destinations</mat-card-title>
        <mat-card-subtitle>Browse approved countries</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions align="end">
        <a mat-flat-button color="primary" routerLink="/destinations">Open</a>
      </mat-card-actions>
    </mat-card>

    <mat-card class="fawry-card-accent dash-card" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="avatar gold">
          <mat-icon>favorite</mat-icon>
        </div>
        <mat-card-title>Wishlist</mat-card-title>
        <mat-card-subtitle>Saved places, newest first</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions align="end">
        <a mat-flat-button color="primary" routerLink="/wishlist">Open</a>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
